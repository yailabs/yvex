[package]
name = "yvex-sdk"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Independent public YVEX platform client"
repository = "https://github.com/yailabs/yvex"

[features]
default = []
native-credentials = ["dep:keyring"]
# Uses an explicitly supplied public native client installation. No private wire.
finite-decision-native = ["dep:bindgen", "dep:cc"]

[build-dependencies]
serde_json = "1"
bindgen = { version = "=0.72.1", optional = true, default-features = false, features = ["runtime"] }
cc = { version = "1", optional = true }

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"
tempfile = "3"

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
httparse = "1"
mdns-sd = "0.15.1"
sha2 = "0.10"
url = "2"
zeroize = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", optional = true, features = ["sync-secret-service", "crypto-rust"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", optional = true, features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", optional = true, features = ["windows-native"] }

[dev-dependencies]
rcgen = "0.13"

# Independently buildable: no compiler/runtime workspace or YAI dependency.
[workspace]
