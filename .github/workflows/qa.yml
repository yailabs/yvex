name: QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native build tools
        run: |
          brew install make pkg-config ripgrep coreutils
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.28
          enable-cache: false
      - name: Install QA Python
        run: |
          uv python install 3.14 --default
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Qualify native CPU and terminal lifecycle
        env:
          # Admission fixtures use declared capacity on the hosted runner;
          # unit.platform still observes actual native memory independently.
          YVEX_TEST_FIXTURE_CAPACITY: '1'
        run: python3 tools/qa.py run native
      - name: Check ownership and build contracts
        run: >-
          make check-qa-registry test-source-ownership test-layout
          test-code-natural test-architecture-boundaries test-repository-layout
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yvex-macos-native-evidence
          path: |
            build/qa/evidence/
            build/qa/runs/*/logs/
          if-no-files-found: warn
          retention-days: 14
  hermetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native QA prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep zlib1g-dev pkg-config valgrind
      - name: Install stable Rust producer toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.28
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Diagnose QA environment
        run: python3 tools/qa.py doctor
      - name: Prepare the documentation publication toolchain
        run: make docs-setup
      - name: Run canonical hosted lane
        run: python3 tools/qa.py run ci
      - name: Check real chat memory ownership
        run: YVEX_REPL_MEMCHECK=valgrind make test-repl
      - name: Upload structured evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yvex-qa-evidence
          path: |
            build/qa/evidence/
            build/qa/runs/*/logs/
          if-no-files-found: warn
          retention-days: 14
