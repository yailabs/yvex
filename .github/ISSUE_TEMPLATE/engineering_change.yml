name: Engineering change
description: Propose one bounded implementation change against a real consumer.
title: "change: "
body:
  - type: markdown
    attributes:
      value: Frame the work as outcome, authority, freedom, invariants, then completion. Link current evidence; leave implementation choices open unless a real boundary constrains them. ROADMAP.md alone owns active project state.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What observable after-state should exist, and what current problem will it resolve?
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Authority
      description: Link live code or measured evidence, the likely semantic owner and the real consumer. Treat historical checkpoints as leads, not current truth.
    validations:
      required: true
  - type: dropdown
    id: roadmap
    attributes:
      label: Roadmap relation
      options:
        - Active milestone
        - Blocked successor
        - Deferred depth with admitted trigger
        - Independent defect repair
    validations:
      required: true
  - type: textarea
    id: freedom
    attributes:
      label: Engineering freedom
      description: Which choices are delegated? Leave blank when normal owner-local implementation and safe validation are unrestricted.
  - type: textarea
    id: invariants
    attributes:
      label: Invariants and non-claims
      description: State compatibility, ownership, safety or resource boundaries that must hold, and higher claims this issue must not imply.
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: Completion and blocker
      description: Name the verifiable finish line, relevant refusal/cleanup evidence and what genuine blocker would stop the work. Do not prescribe a mechanical test itinerary.
    validations:
      required: true
