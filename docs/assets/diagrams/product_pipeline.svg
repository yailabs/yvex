<title id="title">From open weights to live execution.</title>
<desc id="desc">Read the top row from left to right: authenticated source, compiler, artifact and binding. Deployment on the lower right admits the backend and resources, creating an engine generation in the center. The session on the lower left owns independent mutable state. This is a lifecycle overview, not a claim that every source or backend is admitted.</desc>
