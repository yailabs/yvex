<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
<title id="title">Interactive editing is not runtime ownership</title>
<desc id="desc">Pinned REPLAI native Rust owns generic editing, documents, geometry, completion menus and quiet-output restoration. The YVEX Rust product shell owns domain facts, history/candidate meaning, exact typed requests/channels and cancellation. The typed C client retains private-wire ownership. No editable prompt coexists with generation.</desc>
