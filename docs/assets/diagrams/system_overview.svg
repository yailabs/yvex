<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">System context and execution ownership</title>
<desc id="desc">Provider sources feed the offline acquisition and compiler owners. The Rust CLI and loopback HTTP consumers address one persistent host with generation-bound engines and independent sessions. Model execution is admitted on CPU or CUDA. The integrated early Metal backend owns shared storage and F32 embedding primitives; model admission remains open. Typed events observe execution without owning it.</desc>
