<text x="446" y="728" class="body" font-family="Liberation Sans, Arial, sans-serif">Publish one accepted prefix</text>
<text x="446" y="753" class="body" font-family="Liberation Sans, Arial, sans-serif">Discard unaccepted suffix state</text>
