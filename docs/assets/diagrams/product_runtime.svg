<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">Generation: staged state and committed output</title>
<desc id="desc">Native and OpenAI-compatible generation requests resolve a model, current engine generation and session. The engine supplies compiled plans and backend resources. Execution uses newly prefilled positions or incremental decode and, when speculative, target verification. Session providers stage candidate attention, recurrent, draft, token, decoder and RNG state as applicable. The transaction publishes an accepted prefix only after participant preparation succeeds. Cancellation or failure aborts uncommitted work; failed cleanup may invalidate state. Committed fragments are delivered by native events or the separately defined HTTP stream, not by publishing draft proposals.</desc>
