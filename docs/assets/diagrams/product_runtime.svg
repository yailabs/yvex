<text x="836" y="438" class="body" font-family="Liberation Sans, Arial, sans-serif">Draft state when admitted</text>
<text x="836" y="463" class="body" font-family="Liberation Sans, Arial, sans-serif">Token ledger + decoder + RNG</text>
