<title id="title">One host. Explicit lifetimes.</title>
<desc id="desc">Native clients and the bounded OpenAI HTTP adapter submit requests to a persistent host. The host routes by model and generation to admitted engines. Sessions A and B have independent mutable computational state. Loading or unloading an engine does not require restarting the transport. The host can stay available with zero engines.</desc>
