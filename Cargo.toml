[package]
name = "yvex"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false
build = "src/cli/rust/build.rs"

[lib]
path = "src/cli/rust/lib.rs"

[[bin]]
name = "yvex"
path = "src/cli/rust/main.rs"

[[test]]
name = "rust_structure"
path = "tests/rust_structure.rs"

[workspace]
exclude = ["build/external/replai-source"]
resolver = "3"

[dependencies]
replai = { path = "build/external/replai-source" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rustix = { version = "1.1.5", features = ["termios", "event", "fs", "process"] }
signal-hook = "0.3.18"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["poll"] }

[build-dependencies]
bindgen = "0.72.1"
shlex = "=1.3.0"

[dev-dependencies]
syn = { version = "=2.0.119", features = ["full", "visit"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[profile.release]
debug = 1
panic = "unwind"
